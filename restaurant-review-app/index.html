<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Restaurant Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/accessibility.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header role="banner" class="bg-primary text-white py-3">
        <div class="container">
            <h1 class="mb-0">Accessible Restaurant Reviews</h1>
            <nav aria-label="Main navigation" class="mt-2">
                <ul class="nav">
                    <li class="nav-item"><a href="#" class="nav-link text-white active" aria-current="page">Home</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">Search</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">My Reviews</a></li>
                    <li class="nav-item"><a href="#" class="nav-link text-white">Accessibility Settings</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main role="main" class="container my-4">
        <section aria-labelledby="featured-restaurants">
            <h2 id="featured-restaurants">Featured Restaurants</h2>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="restaurant-list">
                <!-- Restaurant cards will be loaded here -->
            </div>
        </section>
    </main>

    <footer role="contentinfo" class="bg-dark text-white py-3">
        <div class="container">
            <p>© 2023 Accessible Restaurant Reviews. All rights reserved.</p>
            <ul class="list-inline mb-0">
                <li class="list-inline-item"><a href="#" class="text-white">Privacy Policy</a></li>
                <li class="list-inline-item"><a href="#" class="text-white">Terms of Service</a></li>
                <li class="list-inline-item"><a href="#" class="text-white">Accessibility Statement</a></li>
            </ul>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
